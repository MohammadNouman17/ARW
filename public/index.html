<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e56">
  <title>Aurora Water plant</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.4 6.8 8.7a8.1 8.1 0 0 0-2 5.3 7.2 7.2 0 0 0 14.4 0 8.1 8.1 0 0 0-2-5.3L12 2.4Zm0 18.1A6.4 6.4 0 0 1 5.6 14c0-1.6.6-3.1 1.6-4.3L12 4l4.8 5.7c1 1.2 1.6 2.7 1.6 4.3a6.4 6.4 0 0 1-6.4 6.5Z"/><path d="M8.3 13.8a.8.8 0 0 1 1.6 0 2.3 2.3 0 0 0 2.3 2.3.8.8 0 0 1 0 1.6 3.9 3.9 0 0 1-3.9-3.9Z"/></svg>
        </div>
        <div>
          <h1>Aurora Water Can Tracker</h1>
          <p id="sync-state">Connecting to database...</p>
        </div>
        <button class="icon-btn" id="btn-refresh" type="button" aria-label="Refresh list" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M17.7 6.3A8 8 0 1 0 20 12h-1.7A6.3 6.3 0 1 1 16.5 7.6H13V6h6v6h-1.6V7.5l-.1-.1.4-1.1Z"/></svg>
        </button>
      </div>
      <section class="stats-row" aria-label="Inventory summary">
        <div class="stat-card">
          <span>Total people</span>
          <strong id="stat-people">0</strong>
        </div>
        <div class="stat-card">
          <span>Total cans out</span>
          <strong id="stat-cans">0</strong>
        </div>
      </section>
    </header>

    <section class="panel">
      <div class="section-label">Add person</div>
      <form class="add-form" id="add-form">
        <div class="input-row">
          <label>
            <span>Name</span>
            <input id="inp-name" type="text" placeholder="Customer name" maxlength="80" autocomplete="name" required>
          </label>
          <label>
            <span>Mobile</span>
            <input id="inp-mobile" type="tel" placeholder="Phone number" maxlength="24" autocomplete="tel" inputmode="tel">
          </label>
          <label>
            <span>Location</span>
            <input id="inp-loc" type="text" placeholder="Area" maxlength="80" autocomplete="address-level2">
          </label>
        </div>
        <div class="form-row">
          <label class="cans-field">
            <span>Cans</span>
            <input id="inp-cans" type="number" min="0" inputmode="numeric" placeholder="0">
          </label>
          <button class="btn-add" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.2 4h1.6v7.2H20v1.6h-7.2V20h-1.6v-7.2H4v-1.6h7.2V4Z"/></svg>
            Add to list
          </button>
        </div>
      </form>
    </section>

    <section class="panel compact">
      <div class="section-label">Search</div>
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.1 10.5l4 4-1.1 1.1-4-4A6.5 6.5 0 1 1 10.5 4Zm0 1.6a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8Z"/></svg>
        <input id="inp-search" type="search" placeholder="Search name, mobile, or location">
      </label>
    </section>

    <section class="list-head">
      <div class="section-label" id="list-count">People (0)</div>
      <button class="text-btn" id="btn-export" type="button">Export CSV</button>
    </section>

    <section class="list" id="person-list" aria-live="polite"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
